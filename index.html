<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fixkosten</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fixkosten">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#000;--card:#1c1c1e;--fld:#2c2c2e;--line:#3a3a3c;--blue:#0a84ff;--green:#30d158;--yellow:#ffd60a;--red:#ff453a;--mute:#8e8e93;color-scheme:dark;box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:#fff;font:400 17px/1.35 -apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display',system-ui,'Helvetica Neue',Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding:12px 16px 48px}
button,input,select{font:inherit;color:inherit}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 6px}
.nb{width:48px;height:48px;border:0;border-radius:50%;background:var(--fld);color:var(--blue);font-size:30px;line-height:1;cursor:pointer;padding:0 0 4px}
.nb:active{opacity:.6}
.mt{position:relative;flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:24px;font-weight:700;letter-spacing:-.01em}
.mt i{width:8px;height:8px;border-right:2.5px solid var(--blue);border-bottom:2.5px solid var(--blue);transform:rotate(45deg) translate(-2px,-2px)}
.mt select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:pointer}
.hint{margin:0 0 14px;text-align:center;color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.bal{display:flex;align-items:center;justify-content:space-between;gap:12px}
.bal>span:first-child{font-weight:600}
.inp{display:flex;align-items:center;gap:6px;background:var(--fld);border:1px solid var(--line);border-radius:12px;padding:0 14px;min-height:48px}
.inp:focus-within,.f:focus{border-color:var(--blue)}
.inp input{width:130px;border:0;background:none;outline:0;text-align:right;font-size:20px;font-weight:600}
.inp b{color:var(--mute);font-weight:500}
.hero{display:grid;gap:12px}
.big{margin:0}
.cap{margin:0;color:var(--mute);font-size:14px;font-weight:500}
.val{margin:2px 0 0;font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.val.neg{color:var(--red)}
.sub{margin:4px 0 0;color:var(--mute);font-size:14px}
.sub.err,.err{color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:12px 0;padding:14px 8px}
.stats>div{text-align:center;padding:0 4px}
.stats>div+div{border-left:1px solid var(--line)}
.stats p:last-child{margin:2px 0 0;font-size:17px;font-weight:700;white-space:nowrap}
.g{color:var(--green)}.y{color:var(--yellow)}
h2{margin:22px 4px 10px;font-size:20px;font-weight:700}
.list{padding:0;overflow:hidden}
.it{display:grid;grid-template-columns:10px 1fr auto 12px;gap:12px;align-items:center;width:100%;min-height:62px;padding:8px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.it:first-child{border-top:0}.it:active{background:var(--fld)}
.d{width:10px;height:10px;border-radius:50%;background:var(--mute);opacity:.5}
.d.open{background:var(--yellow);opacity:1}.d.done{background:var(--green);opacity:1}
.tx{min-width:0}.tx b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx small{display:block;font-size:14px;color:var(--mute)}
.tx small.open{color:var(--yellow)}.tx small.done{color:var(--green)}
.am{font-weight:600}.ch{color:var(--mute);font-size:22px}
.empty{margin:0;padding:18px 16px;color:var(--mute)}
.form{display:grid;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:grid;gap:6px;color:var(--mute);font-size:14px;font-weight:500}
.f{width:100%;min-height:50px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--fld);color:#fff;font-size:17px;outline:0}
.btn{min-height:50px;border:0;border-radius:14px;padding:0 18px;background:var(--fld);color:#fff;font-size:17px;font-weight:600;cursor:pointer}
.btn:active{opacity:.7}.btn.pri{background:var(--blue)}.btn.del{color:var(--red)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts .pri{grid-column:1/-1}
.io{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#st{text-align:center;min-height:20px}
#warn{margin:0 0 12px;padding:12px 14px;border:1px solid var(--red);border-radius:12px;color:var(--red);font-size:15px}
@media(min-width:700px){.hero{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main class="app">
<p id="warn" role="alert" hidden></p>
<header class="nav">
<button class="nb" id="prev" type="button" aria-label="Vorheriger Monat">‹</button>
<label class="mt"><span id="mt"></span><i></i><select id="m" aria-label="Monat und Jahr wählen"></select></label>
<button class="nb" id="next" type="button" aria-label="Nächster Monat">›</button>
</header>
<p class="hint" id="note"></p>
<section class="card"><label class="bal"><span>Kontostand</span><span class="inp"><input id="bal" inputmode="decimal" placeholder="0,00" autocomplete="off" aria-label="Kontostand in Euro"><b>€</b></span></label></section>
<div class="hero">
<section class="card big"><p class="cap">Verbleibendes Budget</p><p class="val" id="rest">–</p><p class="sub" id="restsub"></p></section>
<section class="card big"><p class="cap">Pro Tag verfügbar</p><p class="val" id="per">–</p><p class="sub" id="persub"></p></section>
</div>
<section class="card stats"><div><p class="cap">Gesamtkosten</p><p id="tot">–</p></div><div><p class="cap">Bereits bezahlt</p><p class="g" id="paid">–</p></div><div><p class="cap">Noch offen</p><p class="y" id="open">–</p></div></section>
<p class="sub" style="margin:-4px 4px 0">Posten ohne Abbuchungstag zählen nicht als offen.</p>
<h2>Kosten</h2>
<section class="card list" id="list"></section>
<h2 id="ft">Kosten hinzufügen</h2>
<form class="card form" id="frm" autocomplete="off" novalidate>
<label>Bezeichnung<input class="f" id="fn" maxlength="80" placeholder="z. B. Netflix" enterkeyhint="next"></label>
<div class="row2">
<label>Betrag in €<input class="f" id="fa" inputmode="decimal" placeholder="0,00"></label>
<label>Abbuchungstag<input class="f" id="fd" inputmode="numeric" maxlength="2" placeholder="0 = keiner"></label>
</div>
<p class="sub err" id="ferr" role="alert" style="margin:0"></p>
<div class="acts"><button class="btn pri" type="submit">Speichern</button><button class="btn" id="fx" type="button" hidden>Abbrechen</button><button class="btn del" id="fdel" type="button" hidden>Löschen</button></div>
</form>
<h2>Daten</h2>
<section class="card io"><button class="btn" id="exp" type="button">Exportieren</button><button class="btn" id="imp" type="button">Importieren</button><input type="file" id="file" accept=".json,application/json" hidden></section>
<p class="sub" id="st" role="status"></p>
</main>
<script>
(()=>{
const MN=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const $=s=>document.querySelector(s);
const eur=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'});
const num=new Intl.NumberFormat('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const kf=(y,m)=>y+'-'+String(m+1).padStart(2,'0');
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P='fk3:m:',RE=/^\d{4}-(0[1-9]|1[0-2])$/;
// Vorinstallierte Kosten, bewusst ohne Abbuchungstage
const DEFAULTS=[['Miete',708.66],['Gothaer',33.10],['Debeka',9.07],['Yello Strom',45],['YouTube Premium',27.99],['Vodafone',27],['Teilauto',9.40],['Kredit',203.46],['HBO',5.99],['Handy',10],['GEZ',0],['AXA',19.84],['Apple',2.99]];
const nowKey=()=>{const t=new Date();return kf(t.getFullYear(),t.getMonth())};
let months={},sel=nowKey(),ks=[],canStore=true,editId=null,timer=null,pend=null;
const stat=(t,err)=>{const e=$('#st');e.textContent=t;e.className='sub'+(err?' err':'')};
const warn=t=>{$('#warn').textContent=t;$('#warn').hidden=!t};
const round2=x=>Math.round(x*100)/100+0;

function parse(s){
  s=String(s).replace(/[€\s]/g,'');if(!s)return null;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  const n=parseFloat(s);return isFinite(n)&&/^-?[\d.]+$/.test(s)?n:null;
}
function clean(m){
  if(!m||typeof m!=='object'||!Array.isArray(m.items))return null;
  const b=Number(m.balance);
  return{balance:m.balance==null||m.balance===''||!isFinite(b)?null:b,
    items:m.items.filter(i=>i&&typeof i==='object').slice(0,300).map(i=>{
      const a=Number(i.amount),d=Number(i.day);
      return{id:String(i.id||uid()).slice(0,20),name:String(i.name??'').slice(0,80),
        amount:i.amount==null||i.amount===''||!isFinite(a)?null:a,
        day:i.day==null||i.day===''||!Number.isInteger(d)||d<1||d>31?null:d};
    })};
}
const sortItems=M=>M.items.sort((a,b)=>(a.day?0:1)-(b.day?0:1)||(a.day||0)-(b.day||0));
function storeError(e){
  if(e&&(e.name==='QuotaExceededError'||e.code===22||e.code===1014))return'Speicher voll. Bitte Daten exportieren und nicht mehr benötigte Monate entfernen.';
  if(e&&e.name==='SecurityError')return'Der Browser blockiert das Speichern (z. B. privater Modus). Bitte Daten exportieren.';
  return'Speichern fehlgeschlagen ('+(e&&e.message||'unbekannter Fehler')+'). Bitte Daten exportieren.';
}
function load(){
  let bad=0;
  try{
    localStorage.setItem('fk3:test','1');localStorage.removeItem('fk3:test');
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);if(!k||!k.startsWith(P))continue;
      try{const m=clean(JSON.parse(localStorage.getItem(k))),key=k.slice(P.length);if(RE.test(key)&&m)months[key]=m;else bad++}catch(e){bad++}
    }
  }catch(e){canStore=false;warn('Der Speicher dieses Browsers ist nicht verfügbar (z. B. privater Modus). Eingaben gehen beim Schließen verloren. Bitte regelmäßig exportieren.');return}
  if(bad)warn(bad+' beschädigte(r) Eintrag/Einträge übersprungen. Bitte eine Sicherung importieren.');
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
}
// Schreibt einen Monat und liest zur Kontrolle zurück
function write(k){
  if(!canStore){stat('Nicht gespeichert: Speicher nicht verfügbar.',1);return false}
  try{
    const s=JSON.stringify(months[k]);localStorage.setItem(P+k,s);
    if(localStorage.getItem(P+k)!==s)throw new Error('Kontrolllesen fehlgeschlagen');
    stat('Gespeichert.');return true;
  }catch(e){stat(storeError(e),1);return false}
}
function flushPending(){if(pend){clearTimeout(timer);const k=pend;pend=null;if(months[k])write(k)}}
function mon(k){
  let m=months[k];
  if(!m){
    const all=Object.keys(months).sort(),p=all.filter(x=>x<k).pop()||all.find(x=>x>k);
    m=months[k]={balance:null,items:p?months[p].items.map(i=>({...i,id:uid()})):[]};
    sortItems(m);write(k);
  }
  return m;
}
function calc(){
  const t=new Date(),cur=nowKey(),[y,mo]=sel.split('-').map(Number),dim=new Date(y,mo,0).getDate();
  const r=sel===cur?t.getDate():sel<cur?dim+1:1;
  const M=mon(sel);let sum=0,open=0;
  const st=M.items.map(i=>{
    const a=+i.amount||0;sum+=a;
    if(!i.day)return'none';
    const o=Math.min(i.day,dim)>=r;if(o)open+=a;
    return o?'open':'done';
  });
  return{M,st,sum:round2(sum),open:round2(open),left:dim-r+1,mode:sel===cur?0:sel<cur?-1:1,day:t.getDate()};
}
function cards(c){
  const b=c.M.balance,rest=b==null?null:round2(b-c.open),per=rest!=null&&c.left>0?rest/c.left:null;
  const set=(id,v)=>{const e=$(id);e.textContent=v==null?'–':eur.format(v);e.classList.toggle('neg',v!=null&&v<0)};
  set('#rest',rest);set('#per',per);
  $('#tot').textContent=eur.format(c.sum);$('#paid').textContent=eur.format(round2(c.sum-c.open));$('#open').textContent=eur.format(c.open);
  $('#restsub').textContent=b==null?'Bitte Kontostand eingeben.':'Kontostand abzüglich offener Kosten';
  $('#persub').textContent=c.mode<0?'Für vergangene Monate wird kein Tagesbudget angezeigt.':c.left+' Kalendertage'+(c.mode===0?' inklusive heute':'');
  $('#note').textContent=['Vergangener Monat: alle Kosten gelten als bezahlt.','Laufender Monat: heute ist der '+c.day+'.','Künftiger Monat: alle Kosten mit Abbuchungstag sind offen.'][c.mode+1];
}
const row=(i,s)=>`<button type="button" class="it" data-id="${esc(i.id)}"><i class="d ${s}"></i><span class="tx"><b>${esc(i.name)||'Ohne Bezeichnung'}</b><small class="${s}">${s==='none'?'Ohne Abbuchungstag':(s==='done'?'Abgebucht am ':'Fällig am ')+i.day+'.'}</small></span><span class="am">${i.amount==null?'–':eur.format(i.amount)}</span><span class="ch">›</span></button>`;
function render(){
  const c=calc(),M=c.M;
  $('#mt').textContent=MN[+sel.slice(5)-1]+' '+sel.slice(0,4);
  $('#bal').value=M.balance==null?'':num.format(M.balance);
  $('#list').innerHTML=M.items.length?M.items.map((i,n)=>row(i,c.st[n])).join(''):'<p class="empty">Noch keine Kosten in diesem Monat.</p>';
  cards(c);
}
// Formular: neu oder bearbeiten. Es wird nie beim Tippen neu gezeichnet.
const ferr=t=>{$('#ferr').textContent=t};
function openForm(id){
  editId=id;const it=id&&mon(sel).items.find(x=>x.id===id);
  $('#ft').textContent=it?'Position bearbeiten':'Kosten hinzufügen';
  $('#fn').value=it?it.name:'';$('#fa').value=it&&it.amount!=null?num.format(it.amount):'';$('#fd').value=it&&it.day?it.day:'';
  $('#fx').hidden=$('#fdel').hidden=!it;ferr('');
  if(it){$('#frm').scrollIntoView({behavior:'smooth',block:'center'});$('#fn').focus({preventScroll:true})}
}
$('#list').addEventListener('click',e=>{const b=e.target.closest('.it');if(b)openForm(b.dataset.id)});
$('#fx').onclick=()=>openForm(null);
$('#frm').addEventListener('submit',e=>{
  e.preventDefault();
  const name=$('#fn').value.trim(),a=$('#fa').value.trim(),d=$('#fd').value.trim();
  if(!name)return ferr('Bitte eine Bezeichnung eingeben.');
  const amount=a===''?0:parse(a);if(amount==null)return ferr('Der Betrag ist keine gültige Zahl.');
  const day=d===''?0:(/^\d{1,2}$/.test(d)?+d:-1);if(day<0||day>31)return ferr('Abbuchungstag: Zahl von 0 bis 31 (0 oder leer = ohne Tag).');
  flushPending();const M=mon(sel),was=editId;
  if(was){const it=M.items.find(x=>x.id===was);if(!it)return openForm(null);it.name=name;it.amount=amount;it.day=day||null}
  else M.items.push({id:uid(),name,amount,day:day||null});
  sortItems(M);const ok=write(sel);
  openForm(null);render();if(ok)stat(was?'Änderung gespeichert.':'Position hinzugefügt und gespeichert.');
});
$('#fdel').onclick=()=>{
  if(!editId||!confirm('Diese Position löschen?'))return;
  flushPending();const M=mon(sel);M.items=M.items.filter(x=>x.id!==editId);
  const ok=write(sel);openForm(null);render();if(ok)stat('Position gelöscht.');
};
$('#bal').addEventListener('input',e=>{
  mon(sel).balance=parse(e.target.value);cards(calc());
  pend=sel;clearTimeout(timer);timer=setTimeout(flushPending,400);
});
$('#bal').addEventListener('change',e=>{flushPending();const b=mon(sel).balance;e.target.value=b==null?'':num.format(b)});

const S=$('#m');
function buildSel(){
  const Y=new Date().getFullYear(),yrs=Object.keys(months).map(k=>+k.slice(0,4));
  const y0=Math.min(Y-2,...yrs),y1=Math.max(Y+3,...yrs);let h='';ks=[];
  for(let y=y0;y<=y1;y++){
    h+=`<optgroup label="${y}">`;
    for(let m=0;m<12;m++){const k=kf(y,m);ks.push(k);h+=`<option value="${k}">${MN[m]} ${y}</option>`}
    h+='</optgroup>';
  }
  S.innerHTML=h;S.value=sel;
}
function go(k){
  if(!ks.includes(k))return;
  flushPending();sel=k;S.value=k;mon(k);openForm(null);render();
}
S.onchange=()=>go(S.value);
$('#prev').onclick=()=>go(ks[ks.indexOf(sel)-1]);
$('#next').onclick=()=>go(ks[ks.indexOf(sel)+1]);

$('#exp').onclick=async()=>{
  try{
    flushPending();
    const json=JSON.stringify({app:'fixkosten',version:3,exportedAt:new Date().toISOString(),months},null,2),name='fixkosten-'+nowKey()+'.json';
    const f=window.File&&new File([json],name,{type:'application/json'});
    if(f&&navigator.canShare&&navigator.canShare({files:[f]})){
      try{await navigator.share({files:[f],title:'Fixkosten-Sicherung'});stat('Sicherung exportiert.');return}
      catch(e){if(e&&e.name==='AbortError')return}
    }
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    stat('Export erstellt: '+Object.keys(months).length+' Monat(e).');
  }catch(e){stat('Export fehlgeschlagen: '+e.message,1)}
};
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const d=JSON.parse(await f.text()),src=d&&d.months;
    if(!src||typeof src!=='object'||Array.isArray(src))throw new Error('Keine Monatsdaten in der Datei gefunden.');
    const ok={};let bad=0;
    for(const k of Object.keys(src)){const m=RE.test(k)&&clean(src[k]);if(m)ok[k]=m;else bad++}
    const n=Object.keys(ok).length;if(!n)throw new Error('Die Datei enthält keine gültigen Monate.');
    const over=Object.keys(ok).filter(k=>months[k]).length;
    if(!confirm(n+' Monat(e) importieren'+(over?' ('+over+' vorhandene werden überschrieben)':'')+'?'))return;
    flushPending();let fail=0;
    for(const k of Object.keys(ok)){sortItems(ok[k]);months[k]=ok[k];if(!write(k))fail++}
    buildSel();go(ks.includes(sel)?sel:nowKey());
    if(!fail)stat(n+' Monat(e) importiert'+(bad?', '+bad+' ungültige übersprungen':'')+'.');
  }catch(err){stat('Import fehlgeschlagen: '+(err instanceof SyntaxError?'Die Datei ist kein gültiges JSON.':err.message),1)}
};
addEventListener('pagehide',flushPending);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushPending();else render()});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
load();
if(canStore&&!Object.keys(months).length){
  months[sel]={balance:null,items:DEFAULTS.map(([name,amount])=>({id:uid(),name,amount,day:null}))};write(sel);
}
buildSel();go(sel);
})();
</script>
</body>
</html>
